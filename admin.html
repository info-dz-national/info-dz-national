<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="INFO DZ">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="images/icon-192.svg">
  <link rel="apple-touch-icon" href="images/icon-192.svg">
  <title>INFO DZ NATIONAL - لوحة التحكم</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body { background: var(--black-2); }
    .admin-wrap { max-width: 1100px; margin: 0 auto; padding: 30px 20px; }

    .admin-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 40px;
      flex-wrap: wrap;
    }

    .admin-header .logo { flex-shrink: 0; }
    .admin-header .logo-text h1 { font-size: 1.1rem; }
    .admin-header .logo-text p { font-size: 0.6rem; }

    .admin-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .admin-actions a {
      padding: 10px 24px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.85rem;
      font-family: var(--font-primary);
      transition: var(--transition);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .admin-actions .btn-site {
      background: var(--dark);
      border: 1px solid rgba(255,255,255,0.08);
      color: var(--white);
    }
    .admin-actions .btn-site:hover { border-color: var(--red); }

    .admin-grid {
      display: grid;
      grid-template-columns: 1fr 1.3fr;
      gap: 30px;
      align-items: start;
    }

    .admin-card {
      background: var(--black-3);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 16px;
      padding: 28px;
    }

    .admin-card h2 {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 24px;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--red);
      display: inline-block;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--gray-lighter);
      margin-bottom: 6px;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 12px 16px;
      background: var(--dark);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 8px;
      color: var(--white);
      font-family: var(--font-primary);
      font-size: 0.9rem;
      transition: var(--transition);
      outline: none;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      border-color: var(--red);
      box-shadow: 0 0 20px rgba(210,16,52,0.1);
    }

    .form-group textarea {
      min-height: 120px;
      resize: vertical;
    }

    .form-group select option { background: var(--dark); color: var(--white); }

    .form-group input[type="file"] { padding: 10px; }
    .form-group input[type="file"]::file-selector-button {
      background: var(--red);
      color: var(--white);
      border: none;
      padding: 8px 18px;
      border-radius: 6px;
      font-weight: 700;
      font-family: var(--font-primary);
      cursor: pointer;
      transition: var(--transition);
    }
    .form-group input[type="file"]::file-selector-button:hover { background: var(--red-dark); }

    .img-preview {
      display: block;
      margin-top: 12px;
      max-width: 100%;
      max-height: 180px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.06);
      object-fit: cover;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .form-actions {
      display: flex;
      gap: 12px;
      margin-top: 6px;
      flex-wrap: wrap;
    }

    .form-actions button {
      padding: 12px 28px;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.9rem;
      font-family: var(--font-primary);
      cursor: pointer;
      transition: var(--transition);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 48px;
    }

    .form-actions .btn-add {
      background: var(--red);
      color: var(--white);
    }
    .form-actions .btn-add:hover { background: var(--red-dark); box-shadow: 0 0 30px rgba(210,16,52,0.2); }

    .form-actions .btn-edit {
      background: var(--gold);
      color: var(--black);
    }
    .form-actions .btn-edit:hover { background: var(--gold-dark); }

    .form-actions .btn-cancel {
      background: var(--dark);
      border: 1px solid rgba(255,255,255,0.08);
      color: var(--gray-light);
    }
    .form-actions .btn-cancel:hover { color: var(--white); }

    /* News list table */
    .news-list-wrap {
      max-height: 500px;
      overflow-y: auto;
    }

    .news-list-wrap::-webkit-scrollbar { width: 5px; }
    .news-list-wrap::-webkit-scrollbar-thumb { background: var(--gray); border-radius: 3px; }

    .news-list-item {
      display: flex;
      gap: 14px;
      padding: 14px 0;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      align-items: center;
    }

    .news-list-item:last-child { border-bottom: none; }

    .news-list-item img {
      width: 70px;
      height: 55px;
      object-fit: cover;
      border-radius: 6px;
      flex-shrink: 0;
    }

    .news-list-item .nli-info {
      flex: 1;
      min-width: 0;
    }

    .news-list-item .nli-info h4 {
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .news-list-item .nli-info span {
      font-size: 0.72rem;
      color: var(--gray-light);
    }

    .news-list-item .nli-actions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .news-list-item .nli-actions button {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 0.8rem;
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .nli-actions .btn-edit-sm { background: rgba(200,168,78,0.15); color: var(--gold); }
    .nli-actions .btn-edit-sm:hover { background: var(--gold); color: var(--black); }

    .nli-actions .btn-del-sm { background: rgba(210,16,52,0.15); color: var(--red); }
    .nli-actions .btn-del-sm:hover { background: var(--red); color: var(--white); }

    .nli-actions .btn-up,
    .nli-actions .btn-down { background: rgba(255,255,255,0.05); color: var(--gray-light); }
    .nli-actions .btn-up:hover,
    .nli-actions .btn-down:hover { background: rgba(255,255,255,0.1); color: var(--white); }

    .empty-news {
      text-align: center;
      padding: 40px 20px;
      color: var(--gray-light);
    }

    .empty-news i { font-size: 2.5rem; color: var(--gray); margin-bottom: 14px; display: block; }
    .empty-news p { font-size: 0.9rem; }

    .toast {
      position: fixed;
      bottom: 30px;
      right: 50%;
      transform: translateX(50%);
      background: var(--dark-2);
      border: 1px solid rgba(255,255,255,0.08);
      padding: 14px 28px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 700;
      z-index: 9999;
      opacity: 0;
      visibility: hidden;
      transition: var(--transition);
      box-shadow: 0 8px 40px rgba(0,0,0,0.6);
    }

    .toast.show { opacity: 1; visibility: visible; transform: translateX(50%) translateY(0); }
    .toast.success { border-right: 3px solid var(--green); }
    .toast.error { border-right: 3px solid var(--red); }

    /* Login screen */
    .login-overlay {
      position: fixed;
      inset: 0;
      background: var(--black);
      z-index: 99999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }
    .login-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .login-box {
      background: var(--black-3);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 20px;
      padding: 50px 40px 40px;
      width: 100%;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 20px 80px rgba(0,0,0,0.8);
    }
    .login-box .logo {
      justify-content: center;
      margin-bottom: 10px;
    }
    .login-box .logo-text h1 { font-size: 1.3rem; }
    .login-box .logo-text p { font-size: 0.65rem; }
    .login-box h2 {
      font-size: 1.1rem;
      font-weight: 700;
      margin: 20px 0 6px;
    }
    .login-box p {
      color: var(--gray-light);
      font-size: 0.85rem;
      margin-bottom: 28px;
    }
    .login-box .form-group { text-align: right; }
    .login-box .form-group label { font-size: 0.8rem; }
    .login-box .login-btn {
      width: 100%;
      padding: 14px;
      background: var(--red);
      color: var(--white);
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 700;
      font-family: var(--font-primary);
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 48px;
      margin-top: 8px;
    }
    .login-box .login-btn:hover {
      background: var(--red-dark);
      box-shadow: 0 0 30px rgba(210,16,52,0.2);
    }
    .login-error {
      color: var(--red);
      font-size: 0.8rem;
      min-height: 24px;
      margin-bottom: 4px;
    }
    .admin-wrap { display: none; }
    .admin-wrap.authenticated { display: block; }

    .btn-logout {
      padding: 10px 20px;
      background: transparent;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px;
      color: var(--gray-light);
      font-family: var(--font-primary);
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      transition: var(--transition);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 44px;
    }
    .btn-logout:hover {
      background: var(--red);
      border-color: var(--red);
      color: var(--white);
    }

    @media (max-width: 900px) {
      .admin-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 550px) {
      .admin-header { flex-direction: column; align-items: stretch; text-align: center; }
      .admin-header .logo { justify-content: center; }
      .admin-actions { justify-content: center; flex-wrap: wrap; }
      .form-row { grid-template-columns: 1fr; }
      .admin-card { padding: 20px; }
      .form-actions button { flex: 1; justify-content: center; }
      .news-list-item { flex-wrap: wrap; }
      .news-list-item img { width: 100%; height: 120px; }
      .login-box { padding: 30px 24px 24px; }
    }
  </style>
</head>
<body>

  <!-- Login Overlay -->
  <div class="login-overlay" id="loginOverlay">
    <div class="login-box">
      <div class="logo">
        <div class="logo-icon">
          <img src="برومت_الخريطة_الجزائرية__Cinematic_realistic_202605291925.jpeg" alt="Algeria" class="logo-map">
        </div>
        <div class="logo-text">
          <h1>INFO <span>DZ</span> NATIONAL</h1>
          <p>لوحة التحكم</p>
        </div>
      </div>
      <h2>تسجيل الدخول</h2>
      <p>الرجاء إدخال بيانات الدخول للمتابعة</p>
      <form id="loginForm">
        <div class="form-group">
          <label>اسم المستخدم</label>
          <input type="text" id="loginUser" placeholder="أدخل اسم المستخدم" autocomplete="username" required>
        </div>
        <div class="form-group">
          <label>كلمة المرور</label>
          <input type="password" id="loginPass" placeholder="أدخل كلمة المرور" autocomplete="current-password" required>
        </div>
        <div class="login-error" id="loginError"></div>
        <button type="submit" class="login-btn"><i class="fas fa-lock"></i> دخول</button>
      </form>
    </div>
  </div>

  <div class="admin-wrap" id="adminWrap">

    <!-- Admin Header -->
    <div class="admin-header">
      <a href="index.html" class="logo" style="text-decoration:none;">
        <div class="logo-icon">
          <img src="برومت_الخريطة_الجزائرية__Cinematic_realistic_202605291925.jpeg" alt="Algeria" class="logo-map">
        </div>
        <div class="logo-text">
          <h1>INFO <span>DZ</span> NATIONAL</h1>
          <p>لوحة التحكم</p>
        </div>
      </a>
      <div class="admin-actions">
        <a href="index.html" class="btn-site"><i class="fas fa-external-link-alt"></i> عرض الموقع</a>
        <button class="btn-logout" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> خروج</button>
      </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <div class="admin-grid">

      <!-- Form -->
      <div class="admin-card">
        <h2 id="formTitle">إضافة خبر جديد</h2>
        <form id="newsForm">
          <input type="hidden" id="editIndex" value="-1">

          <div class="form-group">
            <label>عنوان الخبر</label>
            <input type="text" id="newsTitle" placeholder="أدخل عنوان الخبر" required>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>التصنيف</label>
              <select id="newsCategory">
                <option value="الشرطة">الشرطة</option>
                <option value="الدرك الوطني">الدرك الوطني</option>
                <option value="العدالة">العدالة</option>
                <option value="السجن">السجن</option>
                <option value="تحقيقات جنائية">تحقيقات جنائية</option>
                <option value="أخبار وطنية">أخبار وطنية</option>
              </select>
            </div>
            <div class="form-group">
              <label>التاريخ</label>
              <input type="text" id="newsDate" placeholder="مثال: 05 يونيو 2026">
            </div>
          </div>

          <div class="form-group">
            <label>صورة الخبر</label>
            <input type="file" id="newsImage" accept="image/*">
            <img id="imagePreview" class="img-preview" style="display:none;">
          </div>

          <div class="form-group">
            <label>نص الخبر (ملخص)</label>
            <textarea id="newsText" placeholder="أدخل ملخص الخبر" required></textarea>
          </div>

          <div class="form-group">
            <label>النص الكامل</label>
            <textarea id="newsFullText" placeholder="أدخل النص الكامل للخبر" style="min-height:100px;"></textarea>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn-add" id="submitBtn"><i class="fas fa-plus"></i> إضافة الخبر</button>
            <button type="button" class="btn-cancel" id="cancelBtn" style="display:none;"><i class="fas fa-times"></i> إلغاء</button>
          </div>
        </form>
      </div>

      <!-- News List -->
      <div class="admin-card">
        <h2>الأخبار المحفوظة</h2>
        <div class="news-list-wrap" id="newsListContainer">
          <div class="empty-news" id="emptyMsg">
            <i class="fas fa-newspaper"></i>
            <p>لا توجد أخبار محفوظة. أضف خبراً جديداً.</p>
          </div>
        </div>
      </div>

    </div>

    <!-- ========== Video Management ========== -->
    <div class="admin-grid" style="margin-top:40px;">

      <!-- Video Form -->
      <div class="admin-card">
        <h2 id="vFormTitle">إضافة فيديو جديد</h2>
        <form id="videoForm">
          <input type="hidden" id="vEditIndex" value="-1">

          <div class="form-group">
            <label>عنوان الفيديو</label>
            <input type="text" id="videoTitle" placeholder="أدخل عنوان الفيديو" required>
          </div>

          <div class="form-group">
            <label>وصف الفيديو</label>
            <textarea id="videoDescription" placeholder="أدخل وصف الفيديو" style="min-height:80px;"></textarea>
          </div>

          <div class="form-group">
            <label>صورة مصغرة (thumbnail)</label>
            <input type="file" id="videoThumb" accept="image/*">
            <img id="vThumbPreview" class="img-preview" style="display:none;">
          </div>

          <div class="form-group">
            <label>رابط الفيديو (YouTube أو غيره)</label>
            <input type="url" id="videoUrl" placeholder="https://www.youtube.com/watch?v=...">
          </div>

          <div class="form-actions">
            <button type="submit" class="btn-add" id="vSubmitBtn"><i class="fas fa-plus"></i> إضافة الفيديو</button>
            <button type="button" class="btn-cancel" id="vCancelBtn" style="display:none;"><i class="fas fa-times"></i> إلغاء</button>
          </div>
        </form>
      </div>

      <!-- Video List -->
      <div class="admin-card">
        <h2>الفيديوهات المحفوظة</h2>
        <div class="news-list-wrap" id="videoListContainer">
          <div class="empty-news" id="vEmptyMsg">
            <i class="fas fa-video"></i>
            <p>لا توجد فيديوهات محفوظة. أضف فيديو جديداً.</p>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script>
    // ============================================
    // AUTHENTICATION
    // ============================================
    const AUTH_USER = 'admin';
    const AUTH_PASS = 'info2026';
    const AUTH_KEY = 'infoDZAuth';

    const loginOverlay = document.getElementById('loginOverlay');
    const loginForm = document.getElementById('loginForm');
    const loginUser = document.getElementById('loginUser');
    const loginPass = document.getElementById('loginPass');
    const loginError = document.getElementById('loginError');
    const adminWrap = document.getElementById('adminWrap');
    const logoutBtn = document.getElementById('logoutBtn');

    function isLoggedIn() {
      try { return sessionStorage.getItem(AUTH_KEY) === '1'; }
      catch { return false; }
    }

    function showAdmin() {
      loginOverlay.classList.add('hidden');
      adminWrap.classList.add('authenticated');
    }

    function showLogin() {
      loginOverlay.classList.remove('hidden');
      adminWrap.classList.remove('authenticated');
    }

    function doLogin() {
      const user = loginUser.value.trim();
      const pass = loginPass.value.trim();
      if (user === AUTH_USER && pass === AUTH_PASS) {
        try { sessionStorage.setItem(AUTH_KEY, '1'); } catch {}
        loginError.textContent = '';
        showAdmin();
      } else {
        loginError.textContent = 'اسم المستخدم أو كلمة المرور غير صحيحة';
        loginPass.value = '';
        loginPass.focus();
      }
    }

    function doLogout() {
      try { sessionStorage.removeItem(AUTH_KEY); } catch {}
      showLogin();
      loginForm.reset();
      loginError.textContent = '';
      loginUser.focus();
    }

    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      doLogin();
    });

    loginPass.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') doLogin();
    });

    logoutBtn.addEventListener('click', doLogout);

    // Check auth on load
    if (isLoggedIn()) {
      showAdmin();
    } else {
      showLogin();
      loginUser.focus();
    }

    // ============================================
    // ADMIN DASHBOARD
    // ============================================

    const STORAGE_KEY = 'infoDZNews';
    const form = document.getElementById('newsForm');
    const editIndex = document.getElementById('editIndex');
    const newsTitle = document.getElementById('newsTitle');
    const newsCategory = document.getElementById('newsCategory');
    const newsDate = document.getElementById('newsDate');
    const newsImage = document.getElementById('newsImage');
    const imagePreview = document.getElementById('imagePreview');
    const newsText = document.getElementById('newsText');
    const newsFullText = document.getElementById('newsFullText');
    const submitBtn = document.getElementById('submitBtn');
    const cancelBtn = document.getElementById('cancelBtn');
    const formTitle = document.getElementById('formTitle');
    const newsListContainer = document.getElementById('newsListContainer');
    const emptyMsg = document.getElementById('emptyMsg');
    const toast = document.getElementById('toast');

    let _selectedImageDataUrl = '';

    newsImage.addEventListener('change', function() {
      const file = this.files[0];
      if (!file) { imagePreview.style.display = 'none'; _selectedImageDataUrl = ''; return; }
      const reader = new FileReader();
      reader.onload = function(e) {
        _selectedImageDataUrl = e.target.result;
        imagePreview.src = _selectedImageDataUrl;
        imagePreview.style.display = 'block';
      };
      reader.readAsDataURL(file);
    });

    function getNews() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
      catch { return []; }
    }

    function saveNews(data) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    function showToast(msg, type = 'success') {
      toast.textContent = msg;
      toast.className = 'toast ' + type + ' show';
      clearTimeout(toast._timer);
      toast._timer = setTimeout(() => toast.classList.remove('show'), 2500);
    }

    function setDefaultDate() {
      const months = ['يناير','فبراير','مارس','أبريل','ماي','يونيو','يوليو','أوت','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
      const d = new Date();
      if (!newsDate.value) newsDate.value = d.getDate() + ' ' + months[d.getMonth()] + ' ' + d.getFullYear();
    }

    function renderList() {
      const news = getNews();
      const oldItems = newsListContainer.querySelectorAll('.news-list-item');
      oldItems.forEach(el => el.remove());
      emptyMsg.style.display = news.length === 0 ? '' : 'none';

      news.forEach((item, i) => {
        const div = document.createElement('div');
        div.className = 'news-list-item';
        div.innerHTML = `
          <img src="${item.image || 'https://via.placeholder.com/70x55/222/666?text=No+Image'}" alt="${item.title}" onerror="this.src='https://via.placeholder.com/70x55/222/666?text=No+Image'">
          <div class="nli-info">
            <h4>${item.title}</h4>
            <span>${item.category} — ${item.date || ''}</span>
          </div>
          <div class="nli-actions">
            <button class="btn-up" data-index="${i}" title="تحريك لأعلى"><i class="fas fa-chevron-up"></i></button>
            <button class="btn-down" data-index="${i}" title="تحريك لأسفل"><i class="fas fa-chevron-down"></i></button>
            <button class="btn-edit-sm" data-index="${i}" title="تعديل"><i class="fas fa-pen"></i></button>
            <button class="btn-del-sm" data-index="${i}" title="حذف"><i class="fas fa-trash"></i></button>
          </div>
        `;
        newsListContainer.appendChild(div);
      });

      // Bind events
      newsListContainer.querySelectorAll('.btn-edit-sm').forEach(btn => {
        btn.addEventListener('click', () => editNews(parseInt(btn.dataset.index)));
      });
      newsListContainer.querySelectorAll('.btn-del-sm').forEach(btn => {
        btn.addEventListener('click', () => deleteNews(parseInt(btn.dataset.index)));
      });
      newsListContainer.querySelectorAll('.btn-up').forEach(btn => {
        btn.addEventListener('click', () => moveNews(parseInt(btn.dataset.index), -1));
      });
      newsListContainer.querySelectorAll('.btn-down').forEach(btn => {
        btn.addEventListener('click', () => moveNews(parseInt(btn.dataset.index), 1));
      });
    }

    function moveNews(index, dir) {
      const news = getNews();
      const target = index + dir;
      if (target < 0 || target >= news.length) return;
      [news[index], news[target]] = [news[target], news[index]];
      saveNews(news);
      renderList();
    }

    function resetForm() {
      form.reset();
      editIndex.value = '-1';
      submitBtn.innerHTML = '<i class="fas fa-plus"></i> إضافة الخبر';
      formTitle.textContent = 'إضافة خبر جديد';
      cancelBtn.style.display = 'none';
      imagePreview.style.display = 'none';
      imagePreview.src = '';
      _selectedImageDataUrl = '';
      setDefaultDate();
    }

    function editNews(index) {
      const news = getNews();
      const item = news[index];
      if (!item) return;

      editIndex.value = index;
      newsTitle.value = item.title || '';
      newsCategory.value = item.category || 'الشرطة';
      newsDate.value = item.date || '';
      newsImage.value = '';
      _selectedImageDataUrl = item.image || '';
      if (_selectedImageDataUrl) {
        imagePreview.src = _selectedImageDataUrl;
        imagePreview.style.display = 'block';
      } else {
        imagePreview.style.display = 'none';
      }
      newsText.value = item.text || '';
      newsFullText.value = item.fullText || '';

      submitBtn.innerHTML = '<i class="fas fa-save"></i> حفظ التعديلات';
      formTitle.textContent = 'تعديل الخبر';
      cancelBtn.style.display = '';

      document.querySelector('.admin-card').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function deleteNews(index) {
      if (!confirm('هل أنت متأكد من حذف هذا الخبر؟')) return;
      const news = getNews();
      news.splice(index, 1);
      saveNews(news);
      renderList();
      if (parseInt(editIndex.value) === index) resetForm();
      showToast('تم حذف الخبر بنجاح', 'success');
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();

      const title = newsTitle.value.trim();
      const category = newsCategory.value;
      const date = newsDate.value.trim() || new Date().toLocaleDateString('ar-DZ', { year:'numeric', month:'long', day:'numeric' });
      const image = _selectedImageDataUrl;
      const text = newsText.value.trim();
      const fullText = newsFullText.value.trim() || text;

      if (!title || !text) {
        showToast('يرجى ملء الحقول المطلوبة', 'error');
        return;
      }

      const news = getNews();
      const item = { title, category, date, image, text, fullText };
      const idx = parseInt(editIndex.value);

      if (idx >= 0 && idx < news.length) {
        news[idx] = item;
        showToast('تم تعديل الخبر بنجاح', 'success');
      } else {
        news.push(item);
        showToast('تم إضافة الخبر بنجاح', 'success');
      }

      saveNews(news);
      renderList();
      resetForm();
    });

    cancelBtn.addEventListener('click', resetForm);

    // Init
    setDefaultDate();
    renderList();

    // ============================================
    // VIDEO ADMIN
    // ============================================
    const VIDEO_STORAGE_KEY = 'infoDZVideos';
    const vForm = document.getElementById('videoForm');
    const vEditIndex = document.getElementById('vEditIndex');
    const videoTitle = document.getElementById('videoTitle');
    const videoDescription = document.getElementById('videoDescription');
    const videoThumb = document.getElementById('videoThumb');
    const vThumbPreview = document.getElementById('vThumbPreview');
    const videoUrl = document.getElementById('videoUrl');
    const vSubmitBtn = document.getElementById('vSubmitBtn');
    const vCancelBtn = document.getElementById('vCancelBtn');
    const vFormTitle = document.getElementById('vFormTitle');
    const videoListContainer = document.getElementById('videoListContainer');
    const vEmptyMsg = document.getElementById('vEmptyMsg');

    let _selectedVThumbDataUrl = '';

    videoThumb.addEventListener('change', function() {
      const file = this.files[0];
      if (!file) { vThumbPreview.style.display = 'none'; _selectedVThumbDataUrl = ''; return; }
      const reader = new FileReader();
      reader.onload = function(e) {
        _selectedVThumbDataUrl = e.target.result;
        vThumbPreview.src = _selectedVThumbDataUrl;
        vThumbPreview.style.display = 'block';
      };
      reader.readAsDataURL(file);
    });

    function getVideos() {
      try { return JSON.parse(localStorage.getItem(VIDEO_STORAGE_KEY)) || []; }
      catch { return []; }
    }

    function saveVideos(data) {
      localStorage.setItem(VIDEO_STORAGE_KEY, JSON.stringify(data));
    }

    function renderVideoList() {
      const videos = getVideos();
      const oldItems = videoListContainer.querySelectorAll('.news-list-item');
      oldItems.forEach(el => el.remove());
      vEmptyMsg.style.display = videos.length === 0 ? '' : 'none';

      videos.forEach((item, i) => {
        const div = document.createElement('div');
        div.className = 'news-list-item';
        div.innerHTML = `
          <img src="${item.thumbnail || 'https://via.placeholder.com/70x55/222/666?text=No+Image'}" alt="${item.title}" onerror="this.src='https://via.placeholder.com/70x55/222/666?text=No+Image'">
          <div class="nli-info">
            <h4>${item.title}</h4>
            <span>${item.date || ''}</span>
          </div>
          <div class="nli-actions">
            <button class="btn-up" data-index="${i}" title="تحريك لأعلى"><i class="fas fa-chevron-up"></i></button>
            <button class="btn-down" data-index="${i}" title="تحريك لأسفل"><i class="fas fa-chevron-down"></i></button>
            <button class="btn-edit-sm" data-index="${i}" title="تعديل"><i class="fas fa-pen"></i></button>
            <button class="btn-del-sm" data-index="${i}" title="حذف"><i class="fas fa-trash"></i></button>
          </div>
        `;
        videoListContainer.appendChild(div);
      });

      videoListContainer.querySelectorAll('.btn-edit-sm').forEach(btn => {
        btn.addEventListener('click', () => editVideo(parseInt(btn.dataset.index)));
      });
      videoListContainer.querySelectorAll('.btn-del-sm').forEach(btn => {
        btn.addEventListener('click', () => deleteVideo(parseInt(btn.dataset.index)));
      });
      videoListContainer.querySelectorAll('.btn-up').forEach(btn => {
        btn.addEventListener('click', () => moveVideo(parseInt(btn.dataset.index), -1));
      });
      videoListContainer.querySelectorAll('.btn-down').forEach(btn => {
        btn.addEventListener('click', () => moveVideo(parseInt(btn.dataset.index), 1));
      });
    }

    function moveVideo(index, dir) {
      const videos = getVideos();
      const target = index + dir;
      if (target < 0 || target >= videos.length) return;
      [videos[index], videos[target]] = [videos[target], videos[index]];
      saveVideos(videos);
      renderVideoList();
    }

    function resetVideoForm() {
      vForm.reset();
      vEditIndex.value = '-1';
      vSubmitBtn.innerHTML = '<i class="fas fa-plus"></i> إضافة الفيديو';
      vFormTitle.textContent = 'إضافة فيديو جديد';
      vCancelBtn.style.display = 'none';
      vThumbPreview.style.display = 'none';
      vThumbPreview.src = '';
      _selectedVThumbDataUrl = '';
    }

    function editVideo(index) {
      const videos = getVideos();
      const item = videos[index];
      if (!item) return;

      vEditIndex.value = index;
      videoTitle.value = item.title || '';
      videoDescription.value = item.description || '';
      videoThumb.value = '';
      _selectedVThumbDataUrl = item.thumbnail || '';
      if (_selectedVThumbDataUrl) {
        vThumbPreview.src = _selectedVThumbDataUrl;
        vThumbPreview.style.display = 'block';
      } else {
        vThumbPreview.style.display = 'none';
      }
      videoUrl.value = item.url || '';

      vSubmitBtn.innerHTML = '<i class="fas fa-save"></i> حفظ التعديلات';
      vFormTitle.textContent = 'تعديل الفيديو';
      vCancelBtn.style.display = '';

      document.getElementById('vFormTitle').closest('.admin-card').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function deleteVideo(index) {
      if (!confirm('هل أنت متأكد من حذف هذا الفيديو؟')) return;
      const videos = getVideos();
      videos.splice(index, 1);
      saveVideos(videos);
      renderVideoList();
      if (parseInt(vEditIndex.value) === index) resetVideoForm();
      showToast('تم حذف الفيديو بنجاح', 'success');
    }

    vForm.addEventListener('submit', (e) => {
      e.preventDefault();

      const title = videoTitle.value.trim();
      const description = videoDescription.value.trim();
      const thumbnail = _selectedVThumbDataUrl;
      const url = videoUrl.value.trim();
      const date = new Date().toLocaleDateString('ar-DZ', { year:'numeric', month:'long', day:'numeric' });

      if (!title) {
        showToast('يرجى إدخال عنوان الفيديو', 'error');
        return;
      }

      const videos = getVideos();
      const item = { title, description, thumbnail, url, date };
      const idx = parseInt(vEditIndex.value);

      if (idx >= 0 && idx < videos.length) {
        videos[idx] = item;
        showToast('تم تعديل الفيديو بنجاح', 'success');
      } else {
        videos.push(item);
        showToast('تم إضافة الفيديو بنجاح', 'success');
      }

      saveVideos(videos);
      renderVideoList();
      resetVideoForm();
    });

    vCancelBtn.addEventListener('click', resetVideoForm);

    renderVideoList();

    // Register service worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js').catch(function() {});
    }
  </script>
</body>
</html>
